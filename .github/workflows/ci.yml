name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate app definition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JSON and app conventions
        run: node scripts/validate.mjs

      - name: Dry-run the deploy plan
        run: node scripts/deploy.mjs --dry-run
