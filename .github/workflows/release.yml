name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JSON and app conventions
        run: node scripts/validate.mjs

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}"

  # There is no registry to publish a Make app to. Deploying means writing each app section
  # back to Make with the Make CLI (`@makehq/cli`), which authenticates non-interactively from
  # MAKE_API_KEY + MAKE_ZONE. The push is skipped when the repo has no MAKE_API_TOKEN secret,
  # so tagging still produces a release on its own.
  deploy:
    name: Deploy to Make
    needs: release
    runs-on: ubuntu-latest
    env:
      MAKE_API_KEY: ${{ secrets.MAKE_API_TOKEN }}
      # The CLI wants a hostname, not a zone code: "us2.make.com", not "US2".
      # A bare code yields a DNS failure that surfaces only as "fetch failed".
      MAKE_ZONE: ${{ vars.MAKE_ZONE || 'eu1.make.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Advisory, not a gate. Make refuses this API unless the token's user holds
      # the admin "apps edit" permission, which Free organisations cannot grant —
      # Administration > Roles is not available to them. The release itself does
      # not depend on Make, so a refusal is reported rather than failing the run.
      - name: Push the app definition to Make
        id: push
        if: env.MAKE_API_KEY != ''
        continue-on-error: true
        run: node scripts/deploy.mjs

      - name: Report the deploy outcome
        run: |
          if [ -z "$MAKE_API_KEY" ]; then
            echo "::notice::MAKE_API_TOKEN is not set — the app definition was not pushed to Make."
          elif [ "${{ steps.push.outcome }}" = "success" ]; then
            echo "::notice::App definition pushed to Make."
          else
            echo "::warning::Make refused the push. The usual cause is the token's user"
            echo "::warning::lacking the admin \"apps edit\" permission, which needs a plan"
            echo "::warning::where Administration > Roles is available. Until then, deploy"
            echo "::warning::from the Make Apps Editor in VS Code, which uses your session."
          fi
